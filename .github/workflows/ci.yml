name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLKIT_DOWNLOAD_SECRET: ci-only-secret-that-is-at-least-32-characters-long

jobs:
  checks:
    name: Lint, types, tests, audit, claims, build (flag off)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Nothing from the "never" or "once built" lists in platform copy.
      - run: npm run claims:check
      # `npm run build` runs `seo:audit` first: OTTO scripts, colour literals,
      # unsourced numbers, VAT, canonicals and the older rules all gate it.
      # This is the production build: NEXT_PUBLIC_PLATFORM_LAUNCH is unset.
      - run: npm run build
      # The served pages match the pre-launch keyword rows, every Phase 2
      # route is a 404 and no pre-existing URL changed.
      - run: |
          npm run start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 2; done
          npm run seo:check -- --flag off
          npm run schema:check -- --flag off
      - uses: actions/upload-artifact@v4
        with:
          name: next-build-off
          path: .next
          retention-days: 1
          include-hidden-files: true

  accessibility:
    name: axe at 320 / 768 / 1280 and the consent gate (flag off)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build-off
          path: .next
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-off
          path: playwright-report
          retention-days: 7

  platform:
    name: Flag on — build, seo-check, schema, claims, axe, keyboard
    runs-on: ubuntu-latest
    needs: checks
    env:
      NEXT_PUBLIC_PLATFORM_LAUNCH: 'true'
      E2E_PLATFORM: 'on'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The served pages match the launch rows, every Phase 2 page has ≥ 3
      # contextual links in and out, the structured data validates, and the
      # rendered copy (including JSON-LD and llms.txt) claims nothing unbuilt.
      - run: |
          npm run start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 2; done
          npm run seo:check -- --flag on
          npm run schema:check -- --flag on
          npm run claims:check -- --base http://localhost:3000
      # axe on every route, Phase 2 included, and the four keyboard-only flows.
      - run: BASE_URL=http://localhost:3000 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-on
          path: playwright-report
          retention-days: 7
